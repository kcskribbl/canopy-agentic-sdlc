server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/canopy}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.h2.console.enabled=false
links.redis.enabled=${REDIS_ENABLED:false}
links.cache.namespace=${CACHE_NAMESPACE:canopy:links:v1}
links.cache.seconds=${CACHE_SECONDS:60}
links.cache.capacity=${CACHE_CAPACITY:4096}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
links.limit.create=${CREATE_RATE_PER_MINUTE:60}
links.limit.read=${READ_RATE_PER_MINUTE:600}
spring.jackson.deserialization.accept-float-as-int=false
logging.structured.format.console=ecs
docs.enabled=${DOCS_ENABLED:false}
spring.web.resources.add-mappings=false
